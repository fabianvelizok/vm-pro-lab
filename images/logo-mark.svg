<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -8 352 236" role="img" aria-label="VM Pro Lab" fill="none">
  <title>VM Pro Lab</title>
  <defs>
    <linearGradient id="lm-a" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="220" y2="190"><stop offset="0%" stop-color="#73A8FF"/><stop offset="100%" stop-color="#458AF7"/></linearGradient>
    <linearGradient id="lm-b" gradientUnits="userSpaceOnUse" x1="120" y1="30" x2="340" y2="190"><stop offset="0%" stop-color="#5CE6FF"/><stop offset="100%" stop-color="#00BEEC"/></linearGradient>
    <pattern id="lm-int" patternUnits="userSpaceOnUse" width="13" height="13" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="13" stroke="#00D4FF" stroke-width="3.4" stroke-opacity="0.75"/></pattern>
