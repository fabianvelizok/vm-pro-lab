  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
    <text x="60" y="139" text-anchor="middle" font-size="80" fill="url(#lm-a)">V</text>
    <text x="280" y="139" text-anchor="middle" font-size="80" fill="url(#lm-b)">M</text>
